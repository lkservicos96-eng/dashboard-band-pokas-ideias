<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperação de Dados</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:system-ui;max-width:800px;margin:40px auto;padding:20px;background:#0A0C0A;color:#F4F7F4}
h1{color:#2AE98D;font-size:24px;margin-bottom:30px}
.status{background:#151815;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:20px;margin-bottom:16px}
button{background:#2AE98D;color:#0A0C0A;border:0;padding:12px 24px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px;margin-top:10px}
button:hover{opacity:.9}
pre{background:#0A0C0A;padding:12px;border-radius:8px;overflow-x:auto;font-size:12px;margin:10px 0;max-height:400px;overflow-y:auto}
.ok{color:#2AE98D}
.warn{color:#FFC98A}
</style>
</head>
<body>
<h1>🔄 Recuperação de Dados do Supabase</h1>
<div class="status">
  <p>Esta página vai buscar TODOS os lançamentos que estão salvos no Supabase e mostrar para você.</p>
  <button onclick="recuperar()">Buscar Todos os Dados</button>
</div>
<div id="resultado"></div>

<script>
const SUPABASE_URL = 'https://hcozbvjvtcpycuuynijt.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhjb3pidmp2dGNweWN1dXluaWp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2ODQ5NTgsImV4cCI6MjExMDI2MDk1OH0.czjFozPTsWB63OGCmiV-XHuTvNBmkNxwixJqI4Q-QNg';

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function recuperar() {
  const resultado = document.getElementById('resultado');
  resultado.innerHTML = '<div class="status"><p class="warn">Buscando dados do Supabase...</p></div>';

  try {
    const { data, error } = await client.from('transactions').select('*').order('id', { ascending: false });

    if (error) {
      resultado.innerHTML = `<div class="status"><p style="color:#FF7A70">❌ Erro: ${error.message}</p></div>`;
      return;
    }

    if (data.length === 0) {
      resultado.innerHTML = '<div class="status"><p class="warn">⚠️ Nenhum lançamento encontrado no Supabase.</p></div>';
      return;
    }

    let total = 0;
    data.forEach(t => total += Number(t.valor) || 0);

    resultado.innerHTML = `
      <div class="status">
        <p class="ok">✅ Encontrados ${data.length} lançamentos no Supabase</p>
        <p class="ok">Total: R$ ${total.toFixed(2)}</p>
        <button onclick="restaurar()">Restaurar Estes Dados no App</button>
      </div>
      <div class="status">
        <p><strong>Dados salvos no Supabase:</strong></p>
        <pre>${JSON.stringify(data, null, 2)}</pre>
      </div>
    `;

    window.dadosRecuperados = data;

  } catch (e) {
    resultado.innerHTML = `<div class="status"><p style="color:#FF7A70">❌ Erro: ${e.message}</p></div>`;
  }
}

function restaurar() {
  if (!window.dadosRecuperados) {
    alert('Busque os dados primeiro!');
    return;
  }

  // Salva no localStorage
  localStorage.setItem('transactions', JSON.stringify(window.dadosRecuperados));

  alert(`✅ ${window.dadosRecuperados.length} lançamentos foram restaurados!\n\nAgora feche esta página e abra o app normalmente (index.html).`);
}
</script>
</body>
</html>
