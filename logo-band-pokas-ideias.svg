<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 262" width="640" height="524" role="img" aria-label="Logo BAND POKAS IDEIAS — robô trabalhando no notebook">
  <style>
    .gear-spin{transform-box:fill-box;transform-origin:center;animation:gearSpin 11s linear infinite}
    .gear-float{transform-box:fill-box;transform-origin:center;animation:gearFloat 6.5s ease-in-out infinite}
    .gear-float.g2{animation-delay:-2.2s}
    .gear-float.g3{animation-delay:-4.1s}
    .term-cursor{animation:cursorBlink 1.1s steps(1) infinite}
    .term-line{animation:termFade 6s ease-in-out infinite}
    .term-line.l2{animation-delay:.6s}
    .term-line.l3{animation-delay:1.2s}
    .lamp-cone{animation:lampPulse 4.5s ease-in-out infinite}
    .screen-glow{animation:lampPulse 4.5s ease-in-out infinite}
    .robot-head{transform-box:fill-box;transform-origin:center;animation:robotBob 4.2s ease-in-out infinite}
    .robot-eyes{transform-box:fill-box;transform-origin:center;animation:robotBlink 5.4s infinite}
    .robot-hand{transform-box:fill-box;transform-origin:center;animation:robotType .32s ease-in-out infinite alternate}
    @keyframes robotBob{0%,100%{transform:translateY(0)}50%{transform:translateY(2.5px)}}
    @keyframes robotBlink{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
    @keyframes robotType{from{transform:translateY(0)}to{transform:translateY(2.5px)}}
    @keyframes gearSpin{to{transform:rotate(360deg)}}
    @keyframes gearFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-6px) rotate(16deg)}}
    @keyframes cursorBlink{0%,55%{opacity:1}56%,100%{opacity:0}}
    @keyframes termFade{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes lampPulse{0%,100%{opacity:.5}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="mBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCF8F1"/>
      <stop offset="1" stop-color="#E4DCCB"/>
    </linearGradient>
    <linearGradient id="mScreen" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFF2DC"/>
      <stop offset="0.55" stop-color="#FFD9A8"/>
      <stop offset="1" stop-color="#E9963E"/>
    </linearGradient>
    <linearGradient id="mCone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D97706" stop-opacity=".30"/>
      <stop offset="1" stop-color="#D97706" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mChest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8933F"/>
      <stop offset="1" stop-color="#BE6017"/>
    </linearGradient>
    <radialGradient id="mScreenGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFCE8A" stop-opacity=".55"/>
      <stop offset="1" stop-color="#D97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <polygon class="lamp-cone" points="160,30 104,206 216,206" fill="url(#mCone)"/>
  <line x1="160" y1="0" x2="160" y2="9" stroke="#4A423A" stroke-width="2"/>
  <path d="M143 9h34l8 19h-50z" fill="#F0E4D0" stroke="#C2661A" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="160" cy="29" r="2.6" fill="#FFC97A"/>

  <g transform="translate(52,96)">
    <g class="gear-float">
      <circle r="9.5" fill="none" stroke="#D97706" stroke-width="3"/>
      <circle r="2.6" fill="#D97706"/>
      <rect x="-1.5" y="-14.5" width="3" height="5" rx="1.2" fill="#D97706"/>
      <rect x="-1.5" y="9.5" width="3" height="5" rx="1.2" fill="#D97706"/>
      <rect x="-14.5" y="-1.5" width="5" height="3" rx="1.2" fill="#D97706"/>
      <rect x="9.5" y="-1.5" width="5" height="3" rx="1.2" fill="#D97706"/>
      <g transform="rotate(45)">
        <rect x="-1.5" y="-14.5" width="3" height="5" rx="1.2" fill="#D97706"/>
        <rect x="-1.5" y="9.5" width="3" height="5" rx="1.2" fill="#D97706"/>
        <rect x="-14.5" y="-1.5" width="5" height="3" rx="1.2" fill="#D97706"/>
        <rect x="9.5" y="-1.5" width="5" height="3" rx="1.2" fill="#D97706"/>
      </g>
    </g>
  </g>
  <g transform="translate(268,72)">
    <g class="gear-float g2">
      <circle r="7" fill="none" stroke="#CC785C" stroke-width="2.6"/>
      <circle r="2" fill="#CC785C"/>
      <rect x="-1.3" y="-11" width="2.6" height="4" rx="1" fill="#CC785C"/>
      <rect x="-1.3" y="7" width="2.6" height="4" rx="1" fill="#CC785C"/>
      <rect x="-11" y="-1.3" width="4" height="2.6" rx="1" fill="#CC785C"/>
      <rect x="7" y="-1.3" width="4" height="2.6" rx="1" fill="#CC785C"/>
      <g transform="rotate(45)">
        <rect x="-1.3" y="-11" width="2.6" height="4" rx="1" fill="#CC785C"/>
        <rect x="-1.3" y="7" width="2.6" height="4" rx="1" fill="#CC785C"/>
        <rect x="-11" y="-1.3" width="4" height="2.6" rx="1" fill="#CC785C"/>
        <rect x="7" y="-1.3" width="4" height="2.6" rx="1" fill="#CC785C"/>
      </g>
    </g>
  </g>
  <g transform="translate(248,132)">
    <g class="gear-float g3">
      <circle r="5.5" fill="none" stroke="#F0B98A" stroke-width="2.2"/>
      <circle r="1.6" fill="#F0B98A"/>
      <rect x="-1.2" y="-9" width="2.4" height="3.4" rx="1" fill="#F0B98A"/>
      <rect x="-1.2" y="5.6" width="2.4" height="3.4" rx="1" fill="#F0B98A"/>
      <rect x="-9" y="-1.2" width="3.4" height="2.4" rx="1" fill="#F0B98A"/>
      <rect x="5.6" y="-1.2" width="3.4" height="2.4" rx="1" fill="#F0B98A"/>
    </g>
  </g>
  <g transform="translate(74,44)">
    <g class="gear-float g2">
      <circle r="6" fill="none" stroke="#E8933F" stroke-width="2.2"/>
      <circle r="1.7" fill="#E8933F"/>
      <rect x="-1.2" y="-9.6" width="2.4" height="3.6" rx="1" fill="#E8933F"/>
      <rect x="-1.2" y="6" width="2.4" height="3.6" rx="1" fill="#E8933F"/>
      <rect x="-9.6" y="-1.2" width="3.6" height="2.4" rx="1" fill="#E8933F"/>
      <rect x="6" y="-1.2" width="3.6" height="2.4" rx="1" fill="#E8933F"/>
    </g>
  </g>

  <ellipse cx="160" cy="246" rx="118" ry="6" fill="#000" opacity=".35"/>
  <rect x="14" y="196" width="292" height="9" rx="4" fill="#3A3F36"/>
  <rect x="14" y="196" width="292" height="3" rx="1.5" fill="#4C5346" opacity=".7"/>
  <rect x="34" y="205" width="9" height="34" rx="2" fill="#2C312A"/>
