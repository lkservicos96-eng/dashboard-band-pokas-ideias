  <rect x="126" y="212" width="30" height="13" rx="6" fill="#E4DCCB" stroke="#4A423A" stroke-width="1.6"/>
  <rect x="164" y="212" width="30" height="13" rx="6" fill="#E4DCCB" stroke="#4A423A" stroke-width="1.6"/>

  <rect x="112" y="138" width="96" height="60" rx="13" fill="url(#mBody)" stroke="#4A423A" stroke-width="2"/>
  <rect x="125" y="150" width="70" height="37" rx="9" fill="url(#mChest)" stroke="#8A4410" stroke-width="1.4"/>
  <text x="160" y="172" text-anchor="middle" font-family="'Space Grotesk','Inter',sans-serif"
        font-size="11.5" font-weight="700" letter-spacing="-.4" fill="#FFF6E8">BAND PKS</text>
  <circle cx="132" cy="192" r="1.8" fill="#4A423A" opacity=".5"/>
  <circle cx="188" cy="192" r="1.8" fill="#4A423A" opacity=".5"/>

  <rect x="146" y="128" width="28" height="12" rx="3" fill="#CFC5B2" stroke="#4A423A" stroke-width="1.6"/>

  <g>
    <path d="M208 150 L232 168 L236 186" fill="none" stroke="#E4DCCB" stroke-width="11"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M208 150 L232 168 L236 186" fill="none" stroke="#4A423A" stroke-width="11"
          stroke-linecap="round" stroke-linejoin="round" opacity=".16"/>
    <g class="robot-hand">
      <circle cx="237" cy="189" r="7.5" fill="#E8933F" stroke="#4A423A" stroke-width="1.6"/>
    </g>
  </g>
  <g>
    <path d="M112 152 L92 170 L88 186" fill="none" stroke="#E4DCCB" stroke-width="11"
