          <rect x="-1.3" y="8" width="2.6" height="4" rx="1" fill="#B8AD99"/>
          <rect x="-12" y="-1.3" width="4" height="2.6" rx="1" fill="#B8AD99"/>
          <rect x="8" y="-1.3" width="4" height="2.6" rx="1" fill="#B8AD99"/>
        </g>
      </g>
    </g>
    <circle cx="230" cy="98" r="4" fill="#B8AD99" stroke="#4A423A" stroke-width="1.2"/>
