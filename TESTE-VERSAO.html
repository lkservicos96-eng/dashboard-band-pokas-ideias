<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste de Versão</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:system-ui;max-width:600px;margin:40px auto;padding:20px;background:#0A0C0A;color:#F4F7F4}
h1{color:#2AE98D;font-size:20px;margin-bottom:20px}
.test{background:#151815;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:16px;margin-bottom:12px}
.test h2{font-size:14px;margin:0 0 8px;color:#8C948D}
.ok{color:#2AE98D}
.error{color:#FF7A70}
pre{background:#0A0C0A;padding:10px;border-radius:6px;overflow-x:auto;font-size:12px;margin:8px 0 0}
</style>
</head>
<body>
<h1>🔍 Teste de Versão do App</h1>
<div id="results"></div>

<script>
const out = document.getElementById('results');

function show(title, content, isOk) {
  const div = document.createElement('div');
  div.className = 'test';
  div.innerHTML = `<h2>${title}</h2><div class="${isOk ? 'ok' : 'error'}">${content}</div>`;
  out.appendChild(div);
}

// 1. Biblioteca carregou?
if (typeof window.supabase === 'undefined') {
  show('❌ PROBLEMA ENCONTRADO', 'A biblioteca do Supabase NÃO carregou neste aparelho.<br><br>Isso significa que o arquivo index.html que está no ar ainda é a versão antiga, sem sincronização.', false);
} else {
  show('✓ Biblioteca Supabase', 'Carregou corretamente neste aparelho', true);

  // 2. Cliente inicializa?
  try {
    const client = window.supabase.createClient(
      'https://hcozbvjvtcpycuuynijt.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhjb3pidmp2dGNweWN1dXluaWp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2ODQ5NTgsImV4cCI6MjExMDI2MDk1OH0.czjFozPTsWB63OGCmiV-XHuTvNBmkNxwixJqI4Q-QNg'
    );
    show('✓ Cliente Supabase', 'Conectou ao projeto corretamente', true);

    // 3. Tenta buscar dados
    (async () => {
      try {
        const { data, error } = await client.from('transactions').select('*').limit(5);
        if (error) {
          show('❌ Erro ao buscar dados', `${error.message}<br><br>Código: ${error.code}`, false);
        } else {
          show('✓ Dados do Supabase', `Conseguiu buscar ${data.length} lançamentos da nuvem<pre>${JSON.stringify(data, null, 2)}</pre>`, true);
        }
      } catch (e) {
        show('❌ Erro inesperado', e.message, false);
      }
    })();

  } catch (e) {
    show('❌ Erro ao conectar', e.message, false);
  }
}

// Info do aparelho
show('ℹ️ Informação', `Aparelho: ${navigator.userAgent.match(/Mobile|iPhone|iPad|Android/) ? 'Celular' : 'Desktop/PC'}<br>Hora: ${new Date().toLocaleString('pt-BR')}`, true);
</script>
</body>
</html>
